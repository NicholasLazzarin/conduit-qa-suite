name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: Check out the app under test
      uses: actions/checkout@v4
      with:
        repository: c4ffein/realworld-django-ninja
        path: realworld-app
        submodules: recursive

    - uses: actions/setup-python@v5
      with:
        python-version: 3.12