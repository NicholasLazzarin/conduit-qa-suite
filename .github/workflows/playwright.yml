name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7

    - name: Check out the app under test
      uses: actions/checkout@v7
      with:
        repository: c4ffein/realworld-django-ninja
        path: realworld-app
        submodules: recursive

    - uses: actions/setup-node@v7
      with:
        node-version: lts/*

    - name: Start the database
      working-directory: realworld-app
      run: |
        docker compose up -d db
        for i in $(seq 1 60); do
          docker compose exec -T db pg_isready -h 127.0.0.1 -U postgres && exit 0
          sleep 1
        done
        echo "Database did not become ready"
        docker compose logs db
        exit 1

    - name: Start the backend
      working-directory: realworld-app
      run: docker compose up -d --build

    - name: Wait for the API
      working-directory: realworld-app
      run: |
        for i in $(seq 1 60); do
          curl -sf http://localhost:8000/api/tags && exit 0
          sleep 2
        done
        echo "API did not become ready"
        docker compose logs --tail 100
        exit 1

    - name: Install the frontend
      working-directory: realworld-app
      run: make front-setup-react

    - name: Start the frontend
      working-directory: realworld-app
      env:
        BROWSER: none
      run: nohup make front-run-react > "$GITHUB_WORKSPACE/frontend.log" 2>&1 &

    - name: Wait for the frontend
      run: |
        for i in $(seq 1 60); do
          curl -sf http://localhost:4100 > /dev/null && exit 0
          sleep 2
        done
        echo "Frontend did not become ready"
        tail -n 100 frontend.log
        exit 1

    - name: Install test dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Run Playwright tests
      run: npx playwright test --project=chromium

    - name: Update the results dashboard
      if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('results/results.json') != '' }}
      env:
        HISTORY_DB: data/ci-history.db
      run: |
        python3 dashboard/ingest.py
        python3 dashboard/build_html.py
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        echo "Files modified before committing:"
        git status --short
        git add data/ci-history.db docs/index.html
        if git diff --cached --quiet; then
          echo "Nothing to commit"
        else
          git commit -m "Update results dashboard from CI run"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
        fi

    - name: Show app logs on failure
      if: failure()
      run: |
        docker compose -f realworld-app/docker-compose.yml logs --tail 200
        tail -n 100 frontend.log || true

    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30